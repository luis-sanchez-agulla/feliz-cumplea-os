<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sala de Escape - Cumple de Candela</title>
<style>
  /* ============================================
     ESTILOS MINIMOS - SOLO FUNCIONALES, SIN DISEÑO
     (mismo criterio que mapa.html: primero que funcione)
     ============================================ */
  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: sans-serif;
    background: #1a1a1a;
    color: #eee;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  #contenedor {
    max-width: 480px;
    width: 100%;
    padding: 24px 16px;
  }

  #sala-progreso {
    text-align: center;
    color: #aaa;
    font-size: 14px;
    margin-bottom: 4px;
  }

  #sala-titulo {
    text-align: center;
  }

  #sala-pista {
    background: #2a2a2a;
    border: 1px solid #444;
    border-radius: 8px;
    padding: 16px;
    line-height: 1.5;
    white-space: pre-line; /* respeta los "\n\n" de pistas con varios párrafos (ej. sala 3) */
  }

  #input-codigo {
    width: 100%;
    padding: 10px;
    font-size: 16px;
    margin-top: 12px;
    box-sizing: border-box;
  }

  #btn-abrir-candado {
    width: 100%;
    padding: 10px;
    margin-top: 8px;
    cursor: pointer;
    font-size: 16px;
  }

  #sala-feedback {
    color: #f87171;
    min-height: 1.2em;
    text-align: center;
    margin-top: 8px;
  }

  /* ---- Sala tipo "elección" (casillas con foto para tocar) ---- */
  #eleccion-pista {
    background: #2a2a2a;
    border: 1px solid #444;
    border-radius: 8px;
    padding: 16px;
    line-height: 1.5;
    white-space: pre-line;
  }

  #eleccion-opciones {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-top: 12px;
  }

  .casilla-eleccion {
    background: #2a2a2a;
    border: 2px solid #444;
    border-radius: 8px;
    padding: 8px;
    width: 100px;
    cursor: pointer;
    font: inherit;
    color: #eee;
  }

  .casilla-eleccion:hover {
    border-color: #93c5fd;
  }

  .casilla-eleccion img {
    width: 100%;
    height: auto;
    display: block;
  }

  .casilla-eleccion span {
    display: block;
    margin-top: 6px;
    font-size: 14px;
  }

  /* ---- Sala tipo "sopa de letras" ---- */
  #sopa-intro {
    background: #2a2a2a;
    border: 1px solid #444;
    border-radius: 8px;
    padding: 16px;
    line-height: 1.5;
    overflow: hidden; /* contiene la imagen flotante de abajo, si no el fondo/borde quedan más bajos que ella */
  }

  /* mismo ancho que #img-demonio-final en mapa.html (mapa de niveles) */
  #img-demonio-sopa {
    float: left;
    width: 220px;
    height: auto;
    margin: 0 12px 8px 0;
  }

  #sopa-grilla {
    display: grid;
    gap: 1px;
    background: #444;
    border: 1px solid #444;
    margin: 12px 0;
    font-family: monospace;
    user-select: none;
  }

  .celda-sopa {
    background: #2a2a2a;
    color: #eee;
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    transition: color 0.3s ease;
  }

  .celda-sopa.encontrada {
    color: #f87171;
    font-weight: bold;
  }

  #sopa-palabras {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .fila-palabra-sopa {
    display: flex;
    gap: 8px;
  }

  .fila-palabra-sopa input {
    flex: 1;
    min-width: 0;
    padding: 8px;
    font-size: 16px;
    box-sizing: border-box;
  }

  .fila-palabra-sopa button {
    padding: 8px 12px;
    cursor: pointer;
  }

  /* ---- Sala tipo "juego 2048" ---- */
  #zona-2048 {
    text-align: center;
  }

  #intro-2048 {
    background: #2a2a2a;
    border: 1px solid #444;
    border-radius: 8px;
    padding: 16px;
    line-height: 1.5;
    text-align: left;
    margin-bottom: 12px;
    overflow: hidden; /* contiene la imagen flotante, mismo truco que #sopa-intro */
  }

  /* misma imagen y mismo ancho que en la sala 1 (#img-demonio-sopa) y que
     en el mapa (#img-demonio-final en mapa.html) */
  #img-demonio-2048 {
    float: left;
    width: 220px;
    height: auto;
    margin: 0 12px 8px 0;
  }

  #info-2048 {
    color: #ccc;
    margin-bottom: 8px;
  }

  #btn-jugar-2048 {
    padding: 10px 24px;
    font-size: 16px;
    cursor: pointer;
  }

  #tablero-2048 {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    background: #444;
    border: 1px solid #444;
    border-radius: 6px;
    padding: 6px;
    margin: 12px auto 0;
    max-width: 320px;
  }

  .celda-2048 {
    background: #2a2a2a;
    color: #eee;
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: bold;
    border-radius: 4px;
  }

  /* animación mínima al mover: la celda que cambió de valor (ficha que
     entró, se fusionó, o apareció nueva) hace un pequeño "pop" */
  @keyframes destacar-celda-2048 {
    0% { transform: scale(1.15); }
    100% { transform: scale(1); }
  }

  .celda-2048.actualizada {
    animation: destacar-celda-2048 0.15s ease-out;
  }

  /* ---- Diálogo / cutscenes (mismo motor que mapa.html, ver js/dialogo.js) ---- */
  #dialogo-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.6);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    z-index: 200;
  }

  #dialogo-overlay.oculto {
    display: none;
  }

  #dialogo-personaje {
    max-height: 38vh;
    width: auto;
    margin-bottom: -16px;
    pointer-events: none;
  }

  #dialogo-vineta {
    background: #fff;
    border-radius: 24px;
    padding: 20px 24px;
    max-width: 420px;
    width: 100%;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    text-align: center;
  }

  #dialogo-nombre {
    margin: 0 0 8px;
    font-weight: bold;
    color: #d6336c;
  }

  #dialogo-texto {
    margin: 0 0 14px;
    font-size: 16px;
    line-height: 1.4;
    color: #1a1a1a;
  }

  #btn-dialogo-siguiente {
    padding: 8px 20px;
    cursor: pointer;
  }

  /* ---- Sala tipo "despedida" (la última, sin reto) ---- */
  #zona-despedida {
    text-align: center;
  }

  #despedida-texto {
    background: #2a2a2a;
    border: 1px solid #444;
    border-radius: 8px;
    padding: 16px;
    line-height: 1.5;
    text-align: left;
    white-space: pre-line;
  }

  #zona-despedida a {
    display: inline-block;
    margin-top: 16px;
    color: #93c5fd;
  }

  .oculto {
    display: none;
  }

  #zona-debug {
    text-align: center;
    padding: 20px;
  }

  #zona-debug button {
    padding: 6px 12px;
    cursor: pointer;
  }
</style>
</head>
<body>

  <div id="contenedor">
    <div id="zona-juego">
      <p id="sala-progreso"></p>
      <h2 id="sala-titulo"></h2>

      <div id="zona-codigo">
        <p id="sala-pista"></p>
        <input type="text" id="input-codigo" placeholder="Escribe el código" />
        <button id="btn-abrir-candado">Abrir candado</button>
        <p id="sala-feedback"></p>
      </div>

      <div id="zona-eleccion">
        <p id="eleccion-pista"></p>
        <div id="eleccion-opciones"><!-- casillas generadas por JS --></div>
      </div>

      <div id="zona-sopa-letras">
        <div id="sopa-intro">
          <img id="img-demonio-sopa" src="multimedia/demonio con casita.png" alt="Demonio con casita" />
          <p id="sopa-intro-texto"></p>
        </div>
        <div id="sopa-grilla"><!-- celdas generadas por JS --></div>
        <div id="sopa-palabras"><!-- filas de input generadas por JS --></div>
      </div>

      <div id="zona-2048">
        <div id="intro-2048">
          <img id="img-demonio-2048" src="multimedia/demonio con casita.png" alt="Demonio con casita" />
          <p id="intro-2048-texto"></p>
        </div>
        <p id="info-2048">
          <span id="puntuacion-2048"></span> ·
          <span id="objetivo-2048"></span> ·
          <span id="tiempo-2048"></span>
        </p>
        <button id="btn-jugar-2048">Jugar</button>
        <div id="tablero-2048" class="oculto"><!-- celdas generadas por JS --></div>
      </div>

      <div id="zona-despedida">
        <p id="despedida-texto"></p>
        <a href="mapa.html">← Volver al mapa</a>
      </div>
    </div>
  </div>

  <div id="zona-debug">
    <button id="btn-reiniciar-escape">Reiniciar sala de escape (debug)</button>
  </div>

  <!-- Diálogo / cutscenes: mismo motor que mapa.html. Se usa al fallar el
       2048 (sala 2) y para la conversación final antes de la despedida (sala 4) -->
  <div id="dialogo-overlay" class="oculto">
    <img id="dialogo-personaje" alt="" />
    <div id="dialogo-vineta">
      <p id="dialogo-nombre"></p>
      <p id="dialogo-texto"></p>
      <button id="btn-dialogo-siguiente">Siguiente ▶</button>
    </div>
  </div>

  <script src="js/normalizar.js"></script>
  <script src="js/sopa-letras.js"></script>
  <script src="js/juego-2048.js"></script>
  <script src="js/conversaciones.js"></script>
  <script src="js/dialogo.js"></script>
  <script src="js/escape-salas.js"></script>
  <script src="js/escape.js"></script>
</body>
</html>
